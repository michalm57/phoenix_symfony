framework:
    cache:
        app: cache.adapter.redis_tag_aware 
        default_redis_provider: '%env(REDIS_DSN)%'
        pools:
            phoenix_data_cache:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 3600
services:
    App\Repository\UserRepository:
        arguments:
            $cache: '@cache.phoenix_data_cache'